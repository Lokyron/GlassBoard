services:
  glassboard:
    # Built from this repository: no prebuilt image is published.
    build: .
    container_name: glassboard
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      # Required. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in your .env file}
      # Set to 1 when a reverse proxy terminates TLS in front of Glassboard.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      OSM_CONTACT: ${OSM_CONTACT:-}
    volumes:
      - glassboard-data:/data

volumes:
  glassboard-data:
