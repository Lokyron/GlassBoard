name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste your own URLs, host names,
        tokens or coordinates: blur or replace them.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Instead of ..., the page ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running (`git rev-parse --short HEAD`), or the release.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Docker
        - Node directly
        - Node behind a reverse proxy
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on Linux / Safari on iPhone 15, installed app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs or the browser console
      description: Server output and browser console errors, with personal data removed.
      render: text
